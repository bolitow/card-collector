[project]
name = "card-collector-api"
version = "0.1.0"
description = "API de l'application de collections de cartes"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "pillow>=11.0",
    "pillow-heif>=0.20",
    "python-multipart>=0.0.17",
    "boto3>=1.35",
    "anthropic>=0.75",
    "pypdf>=5.1",
    "pyotp>=2.9",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # Depends() en valeur par défaut : idiome FastAPI

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"app/services/ai.py" = ["E501"]   # consignes envoyées au modèle
"app/services/mail.py" = ["E501"] # textes des e-mails
"migrations/versions/*" = ["E501"]
